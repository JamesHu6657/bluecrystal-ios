# PR 上的检查（Brain 第二轮审查 M5）：Build Unsigned IPA 只在 push 到 main 时跑，
# 安全相关的改动合并前没有任何编译或测试。这里只跑 ProtocolChecks + 编译：不打包、不上传 IPA、不发布、不推任何分支。
# 失败时把测试/编译错误摘要评论到 PR 上，便于排查。
name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 声画融合关着对照要拿到 f706431（v1.8.3）的 VisualSync.swift
          fetch-depth: 0

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          V="$(xcodebuild -version)"
          echo "$V"
          [ "$(printf '%s\n' "$V" | head -n1)" = "Xcode 16.4" ]

      # 和 Build Unsigned IPA 里的检查完全同一条命令
      - name: Protocol and safety checks
        run: |
          set -euo pipefail
          xcrun swiftc \
            BlueCrystalIOS/Protocol.swift \
            BlueCrystalIOS/Models.swift \
            BlueCrystalIOS/SafetyLedger.swift \
            BlueCrystalIOS/AIProgram.swift \
            Tests/ProtocolChecks/main.swift \
            -o "$RUNNER_TEMP/protocol-checks" 2>&1 | tee tests.log
          "$RUNNER_TEMP/protocol-checks" 2>&1 | tee -a tests.log

      # 第四轮修复的回归检查（同样只编译纯类型）：全角 / 零宽指令、收藏逐条解码与撤销顺序、时间轴校验
      - name: Round 4 checks
        run: |
          set -euo pipefail
          xcrun swiftc \
            BlueCrystalIOS/Protocol.swift \
            BlueCrystalIOS/Models.swift \
            BlueCrystalIOS/SafetyLedger.swift \
            BlueCrystalIOS/AIProgram.swift \
            Tests/Round4Checks/main.swift \
            -o "$RUNNER_TEMP/round4-checks" 2>&1 | tee -a tests.log
          "$RUNNER_TEMP/round4-checks" 2>&1 | tee -a tests.log

      # 画面联动 P1 的纯逻辑检查（纯类型 + VisualSync.swift）：降采样、帧差、切换、归一化、出口、设置
      - name: Visual sync checks
        run: |
          set -euo pipefail
          xcrun swiftc \
            BlueCrystalIOS/Protocol.swift \
            BlueCrystalIOS/Models.swift \
            BlueCrystalIOS/SafetyLedger.swift \
            BlueCrystalIOS/AIProgram.swift \
            BlueCrystalIOS/VisualSync.swift \
            Tests/VisualSyncChecks/main.swift \
            -o "$RUNNER_TEMP/visual-sync-checks" 2>&1 | tee -a tests.log
          # 检查程序顶层很大，8 MB 默认栈不够（Debug 构建），把栈加到 64 MB
          ulimit -s 65520 || true
          "$RUNNER_TEMP/visual-sync-checks" 2>&1 | tee -a tests.log

      # 声画融合（av-fusion）关着 = f706431（v1.8.3）逐位相同：同一份整条链模拟和 f706431 / 当前分支 / 当前分支 + 融合部件跟着跑
      # 各编一份，输出必须逐字节相同（-O 构建，栈够用）
      - name: Fusion off compare (vs f706431)
        run: |
          set -euo pipefail
          bash Tests/FusionOffCompare/run.sh f706431 2>&1 | tee -a tests.log

      # 只编译（BLEManager / 各 View 只有这里能验证），不打包、不上传
      - name: Compile app (no signing, no IPA)
        run: |
          set -euo pipefail
          xcodebuild \
            -project BlueCrystalIOS.xcodeproj \
            -scheme BlueCrystalIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Report failure on PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          touch tests.log build.log
          {
            echo "PR Checks 失败（${GITHUB_SHA}）"
            echo
            echo '```'
            grep -E "FAIL|error:" tests.log | head -n 60 || true
            grep -E "error:" build.log | sort -u | head -n 60 || true
            echo '```'
          } > report.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md || true
          # 让没有日志权限的工具也能从 PR 描述里读到错误摘要
          { gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body -q .body | sed '/^<!-- ci-report -->/,$d'; echo "<!-- ci-report -->"; cat report.md; } > body.md
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md || true
