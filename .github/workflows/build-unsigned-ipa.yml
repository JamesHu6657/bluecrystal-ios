# push 到 main（或手动触发）时编译 unsigned IPA，供 AltStore / Sideloadly 自签安装。
# 不需要证书、描述文件或 Secrets。
name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 失败时把日志推到 ci-logs 分支，便于排查

# 并行的失败运行会抢着 push -f ci-logs：串行执行
concurrency:
  group: build-unsigned-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 写权限 token 不留在 .git/config 里；失败日志推送时显式带上
          persist-credentials: false

      # 不再用第三方 action：直接选 runner 自带的 Xcode 16.4，并核对版本
      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          V="$(xcodebuild -version)"
          echo "$V"
          # 不用 grep -q 接管道：grep 提前退出会让 xcodebuild 收到 SIGPIPE，pipefail 下误判失败
          [ "$(printf '%s\n' "$V" | head -n1)" = "Xcode 16.4" ]

      # 钉住实抓帧字节、官方换算、安全上限和 AI 指令解析/停止词（Tests/ProtocolChecks/main.swift）
      - name: Protocol and safety checks
        run: |
          set -euo pipefail
          xcrun swiftc \
            BlueCrystalIOS/Protocol.swift \
            BlueCrystalIOS/Models.swift \
            BlueCrystalIOS/SafetyLedger.swift \
            BlueCrystalIOS/AIProgram.swift \
            Tests/ProtocolChecks/main.swift \
            -o "$RUNNER_TEMP/protocol-checks" 2>&1 | tee tests.log
          "$RUNNER_TEMP/protocol-checks" 2>&1 | tee -a tests.log

      # 画面联动 P1 的纯逻辑检查（和 PR Checks 里同一条命令）：降采样、帧差、切换、归一化、出口、设置
      - name: Visual sync checks
        run: |
          set -euo pipefail
          xcrun swiftc \
            BlueCrystalIOS/Protocol.swift \
            BlueCrystalIOS/Models.swift \
            BlueCrystalIOS/SafetyLedger.swift \
            BlueCrystalIOS/AIProgram.swift \
            BlueCrystalIOS/VisualSync.swift \
            Tests/VisualSyncChecks/main.swift \
            -o "$RUNNER_TEMP/visual-sync-checks" 2>&1 | tee -a tests.log
          # 检查程序顶层很大，8 MB 默认栈不够（Debug 构建），把栈加到 64 MB
          ulimit -s 65520 || true
          "$RUNNER_TEMP/visual-sync-checks" 2>&1 | tee -a tests.log

      - name: Build (Release, iphoneos, no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project BlueCrystalIOS.xcodeproj \
            -scheme BlueCrystalIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            BC_GIT_COMMIT="$GITHUB_SHA" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          {
            set -euo pipefail
            APP="build/Build/Products/Release-iphoneos/BlueCrystalIOS.app"
            test -d "$APP"
            # 包里必须带着这次构建的提交号（Publish Release 会核对）
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :BCGitCommit' "$APP/Info.plist")" = "$GITHUB_SHA"
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry BlueCrystalIOS-unsigned.ipa Payload
            shasum -a 256 BlueCrystalIOS-unsigned.ipa | tee BlueCrystalIOS-unsigned.ipa.sha256
          } 2>&1 | tee package.log

      - uses: actions/upload-artifact@v4
        with:
          name: BlueCrystalIOS-unsigned
          path: |
            BlueCrystalIOS-unsigned.ipa
            BlueCrystalIOS-unsigned.ipa.sha256
          if-no-files-found: error

      # 放在最后：测试、编译、打包任何一步失败都能拿到日志
      - name: Push logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          touch build.log tests.log package.log
          grep -E "error:|warning: .*BlueCrystal|\*\* BUILD" build.log > build-errors.log || true
          tail -n 300 build.log > build-tail.log || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null
          git add -f build-errors.log build-tail.log tests.log package.log
          git commit -m "build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs
