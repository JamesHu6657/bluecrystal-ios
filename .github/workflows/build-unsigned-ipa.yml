# push 到 main（或手动触发）时编译 unsigned IPA，供 AltStore / Sideloadly 自签安装。
# 不需要证书、描述文件或 Secrets。
name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 失败时把编译日志推到 ci-logs 分支，便于排查

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (pinned 16.4)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build (Release, iphoneos, no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project BlueCrystalIOS.xcodeproj \
            -scheme BlueCrystalIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Push build log on failure
        if: failure()
        run: |
          grep -E "error:|warning: .*BlueCrystal|\*\* BUILD" build.log > build-errors.log || true
          tail -n 300 build.log > build-tail.log || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null
          git add -f build-errors.log build-tail.log
          git commit -m "build log for ${GITHUB_SHA}"
          git push -f origin ci-logs

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/BlueCrystalIOS.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BlueCrystalIOS-unsigned.ipa Payload
          shasum -a 256 BlueCrystalIOS-unsigned.ipa | tee BlueCrystalIOS-unsigned.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BlueCrystalIOS-unsigned
          path: |
            BlueCrystalIOS-unsigned.ipa
            BlueCrystalIOS-unsigned.ipa.sha256
          if-no-files-found: error
