# push 到 main（或手动触发）时编译 unsigned IPA，供 AltStore / Sideloadly 自签安装。
# 不需要证书、描述文件或 Secrets。
name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (pinned 16.4)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build (Release, iphoneos, no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project BlueCrystalIOS.xcodeproj \
            -scheme BlueCrystalIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/BlueCrystalIOS.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BlueCrystalIOS-unsigned.ipa Payload
          shasum -a 256 BlueCrystalIOS-unsigned.ipa | tee BlueCrystalIOS-unsigned.ipa.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BlueCrystalIOS-unsigned
          path: |
            BlueCrystalIOS-unsigned.ipa
            BlueCrystalIOS-unsigned.ipa.sha256
          if-no-files-found: error
